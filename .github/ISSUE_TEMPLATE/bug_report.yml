name: Bug report
description: Something in BioKey doesn’t work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. A security problem (a way to open a locked app without
        your face, fingerprint, screen lock or passphrase, say) shouldn’t be reported here:
        see SECURITY.md and email it instead.

        This issue is public. Leave out anything you’d rather keep private.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: As exactly as you can. Which app was locked, and how you opened it (its icon, Recents, a notification, a link).
      placeholder: |
        1. Lock an app in BioKey
        2. ...
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Phone model
      placeholder: Pixel 9, Galaxy Z Fold7, ...
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: Android 16, Android 17 QPR2, One UI 8, ...
    validations:
      required: true

  - type: input
    id: biokey-version
    attributes:
      label: BioKey version
      description: At the foot of BioKey’s settings, or in Android Settings > Apps > BioKey, at the bottom of the page.
      placeholder: "2.0.1"
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: How BioKey was working
      description: In compatibility mode, BioKey’s settings show “On · compatibility mode” under Protection.
      options:
        - Accessibility service (listed as “BioKey” in Android’s Accessibility settings)
        - Compatibility mode (usage access and display over other apps)
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: install-source
    attributes:
      label: Where BioKey came from
      options:
        - Google Play
        - Built from source
        - Another APK
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Diagnostic log (optional)
      description: |
        In BioKey’s settings, open View diagnostic log and tap the share icon (Share the
        diagnostic log). It lists your locked apps by package name (the ID Android knows each
        app by, such as com.example.bank); remove any lines you’d rather not post.
      render: text

  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots or recordings (BioKey’s own screens can’t be captured), other app locks or accessibility services on the phone, split screen or a foldable, Advanced Protection on.
