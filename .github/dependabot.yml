# Weekly update pull requests for the CI actions (pinned by commit SHA in workflows/ci.yml), the
# Gradle plugins and libraries in gradle/libs.versions.toml, and the Android Gradle plugin of the
# gantlet's target apps (tools/gantlet-targets, a build of its own), so it keeps up with BioKey's.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: gradle
    directory: /tools/gantlet-targets
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
