# Builds BioKey and runs its tests on every push and pull request: the locking rules
# (SessionRulesTest, PickerHopTest, ProfileLockRulesTest, RecentsGestureTest), the design
# screenshots, lint and a debug build. Release signing never happens here.
name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs the SDK and accepts its licences, so Gradle can fetch compileSdk 37.2 itself.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Keep test reports and design screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/screenshots/
          retention-days: 14
