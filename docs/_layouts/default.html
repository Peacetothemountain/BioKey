<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}: an app lock for Android{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9fe">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111221">
  <link rel="icon" href="{{ '/assets/logo.svg' | relative_url }}" type="image/svg+xml">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ '/assets/feature-graphic.png' | absolute_url }}">
  <!-- Everything this page loads comes from this site: no fonts, scripts, analytics or embeds from anyone else. -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="page-{{ page.slug | default: 'home' }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include mark-defs.html %}

  <header class="site-header">
    <div class="wrap site-header__row">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="BioKey home">
        <svg class="brand__mark" aria-hidden="true" focusable="false"><use href="#bk-mark"/></svg>
        <span class="brand__name">BioKey</span>
      </a>
      <nav class="site-nav" aria-label="Site">
        <a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} aria-current="page"{% endif %}>Privacy</a>
        <a href="{{ '/support/' | relative_url }}"{% if page.url == '/support/' %} aria-current="page"{% endif %}>Support</a>
        <a href="https://github.com/Peacetothemountain/BioKey">GitHub</a>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap site-footer__row">
      <div class="site-footer__brand">
        <svg class="brand__mark" aria-hidden="true" focusable="false"><use href="#bk-mark"/></svg>
        <p>BioKey is made by NB Designs.<br>No internet access, no data collected.</p>
      </div>
      <nav class="site-footer__links" aria-label="Footer">
        <a href="{{ '/privacy/' | relative_url }}">Privacy policy</a>
        <a href="{{ '/support/' | relative_url }}">Help and support</a>
        <a href="https://github.com/Peacetothemountain/BioKey">Source on GitHub</a>
        <a href="mailto:{{ site.email }}">{{ site.email }}</a>
      </nav>
    </div>
  </footer>
</body>
</html>
