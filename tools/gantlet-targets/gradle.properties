# A build of its own (./gradlew -p tools/gantlet-targets) doesn't read the root gradle.properties,
# so it repeats what it needs from there: the same daemon settings (a different heap would start a
# second daemon beside the first), and the build and configuration caches.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
